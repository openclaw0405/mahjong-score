<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>麻雀計分器</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#171311;
      --panel:#241d19;
      --panel-2:#2f2621;
      --ink:#f6ede4;
      --muted:#c7b29f;
      --soft:#8f7968;
      --line:rgba(255,255,255,.09);
      --accent:#f3b37a;
      --accent-2:#e48652;
      --green:#5dc087;
      --red:#ea6f5a;
      --shadow:0 18px 48px rgba(0,0,0,.35);
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:radial-gradient(circle at top,#2e241f 0%,#171311 55%);color:var(--ink);font-family:'Noto Sans HK',system-ui,sans-serif}
    body{min-height:100vh}
    .wrap{max-width:1080px;margin:0 auto;padding:24px 16px 64px}
    .hero{padding:16px 6px 22px}
    .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
    h1{font-size:clamp(32px,7vw,56px);line-height:.95;margin:0 0 10px}
    .sub{color:var(--muted);font-size:15px;line-height:1.6;max-width:760px}
    .grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;align-items:start}
    .card{background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.02));border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}
    .card-inner{padding:20px}
    .rulebar,.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
    .pill,.chip{padding:10px 14px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--ink);font-size:13px}
    .chip button{all:unset;cursor:pointer;color:var(--soft);margin-left:8px}
    .section-title{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
    .fan-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
    .fan-btn{border:none;border-radius:18px;padding:16px 10px;background:var(--panel-2);color:var(--ink);cursor:pointer;transition:transform .12s ease, background .12s ease, box-shadow .12s ease, color .12s ease;border:1px solid transparent}
    .fan-btn strong{display:block;font-size:24px;line-height:1;margin-bottom:6px}
    .fan-btn span{font-size:12px;color:var(--muted)}
    .fan-btn:hover{transform:translateY(-1px)}
    .fan-btn.active{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#1e120b;box-shadow:0 14px 28px rgba(228,134,82,.28)}
    .fan-btn.active span{color:rgba(30,18,11,.78)}
    .score-box{display:grid;gap:14px}
    .score-main{padding:18px 18px 16px;border-radius:22px;background:linear-gradient(135deg,#3a2b22,#241b16);border:1px solid var(--line)}
    .score-label{font-size:13px;color:var(--muted);margin-bottom:4px}
    .score-value{font-size:clamp(50px,10vw,86px);line-height:1;font-weight:800;letter-spacing:-.04em}
    .score-caption{margin-top:10px;font-size:14px;color:var(--muted)}
    .formula{padding:14px 16px;border-radius:18px;background:rgba(255,255,255,.04);border:1px solid var(--line);font-size:14px;color:var(--muted)}
    .formula code{color:var(--ink);font-weight:700}
    .score-table,.totals,.history,.roster-panel{display:grid;gap:10px}
    .row{display:grid;grid-template-columns:80px 1fr 96px;gap:10px;align-items:center;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
    .row .fan{font-weight:700}
    .bar{height:10px;border-radius:999px;background:rgba(255,255,255,.06);overflow:hidden}
    .bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:999px}
    .pts{text-align:right;font-weight:800}
    .mini{font-size:12px;color:var(--soft)}
    .names{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .field{display:grid;gap:6px}
    .field label{font-size:13px;color:var(--muted)}
    .field input,.field select{width:100%;background:#1d1714;border:1px solid var(--line);color:var(--ink);border-radius:14px;padding:13px 14px;font:inherit;outline:none}
    .inline-add{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
    button.primary,button.secondary{border:none;border-radius:14px;padding:13px 16px;font:inherit;font-weight:700;cursor:pointer;transition:transform .1s ease, opacity .1s ease}
    button.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#21130b}
    button.secondary{background:rgba(255,255,255,.06);color:var(--ink);border:1px solid var(--line)}
    button.primary:active,button.secondary:active,.fan-btn:active{transform:scale(.98)}
    .player-total,.roster-item{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
    .player-name{font-weight:700}
    .player-score{font-size:24px;font-weight:800}
    .plus{color:var(--green)}
    .minus{color:var(--red)}
    .history-item{padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
    .history-item strong{display:block;margin-bottom:4px}
    .empty{color:var(--soft);font-size:14px}
    .foot{margin-top:18px;font-size:13px;color:var(--soft);line-height:1.6}
    @media (max-width: 860px){.grid{grid-template-columns:1fr}}
    @media (max-width: 560px){.fan-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.row{grid-template-columns:64px 1fr 80px}.names{grid-template-columns:1fr}.inline-add{grid-template-columns:1fr}.wrap{padding-left:12px;padding-right:12px}.card-inner{padding:16px}}
  </style>
</head>
<body>
  <div class="wrap">
    <section class="hero">
      <div class="eyebrow">Traditional Mahjong · 香港常用簡化記分</div>
      <h1>麻雀計分器</h1>
      <div class="sub">而家改成用<strong>人名</strong>做計分單位。你可以先加入人名，再揀今鋪邊四個人落場。就算中途換人，分數都會繼續累積喺各自名下。</div>
      <div class="rulebar">
        <div class="pill">三番起糊</div>
        <div class="pill">封頂十番</div>
        <div class="pill">出銃 3 番 = 16</div>
        <div class="pill">自摸：其餘三家各付同分</div>
      </div>
    </section>

    <section class="grid">
      <div class="card">
        <div class="card-inner">
          <div class="section-title">即時計分</div>
          <div class="fan-grid" id="fanGrid"></div>
          <div class="score-box" style="margin-top:16px">
            <div class="score-main">
              <div class="score-label" id="scoreLabel">出銃分數</div>
              <div class="score-value" id="scoreValue">16</div>
              <div class="score-caption"><span id="scoreFanText">3 番</span> · <span id="scoreDesc">一炮16</span></div>
            </div>
            <div class="formula">公式：<code>16 × 2^(番數 - 3)</code></div>
          </div>
          <div class="section-title" style="margin-top:22px">番數總表</div>
          <div class="score-table" id="scoreTable"></div>
        </div>
      </div>

      <div class="card">
        <div class="card-inner">
          <div class="section-title">玩家名單</div>
          <div class="inline-add">
            <div class="field">
              <label>新增玩家</label>
              <input id="newPlayerInput" maxlength="18" placeholder="例如：Kenneth">
            </div>
            <button class="primary" id="addPlayerBtn">加入名單</button>
          </div>
          <div class="chips" id="playerChips"></div>

          <div class="section-title" style="margin-top:18px">今鋪四位玩家</div>
          <div class="names">
            <div class="field"><label>位 1</label><select id="seat0"></select></div>
            <div class="field"><label>位 2</label><select id="seat1"></select></div>
            <div class="field"><label>位 3</label><select id="seat2"></select></div>
            <div class="field"><label>位 4</label><select id="seat3"></select></div>
          </div>

          <div class="names" style="margin-top:12px">
            <div class="field">
              <label>計分方式</label>
              <select id="winType">
                <option value="discard">出銃</option>
                <option value="selfdraw">自摸</option>
              </select>
            </div>
            <div class="field">
              <label>邊個糊</label>
              <select id="winner"></select>
            </div>
            <div class="field">
              <label id="loserLabel">邊個出銃</label>
              <select id="loser"></select>
            </div>
          </div>

          <div class="actions">
            <button class="primary" id="applyBtn">記錄呢鋪</button>
            <button class="secondary" id="undoBtn">Undo</button>
            <button class="secondary" id="resetBtn">清零分數</button>
          </div>

          <div class="section-title" style="margin-top:20px">總分排行榜</div>
          <div class="totals" id="totals"></div>

          <div class="section-title" style="margin-top:20px">最近紀錄</div>
          <div class="history" id="history"></div>

          <div class="foot">註：分數跟住<strong>人名</strong>走，唔係跟住座位。即係你隨時可以換今鋪四個人，之前累積分數唔會消失。自摸暫時係簡化版：其餘三家各付同樣分數。</div>
        </div>
      </div>
    </section>
  </div>

  <script>
    const fanValues = [3,4,5,6,7,8,9,10];
    const defaultPlayers = ['東','南','西','北'];
    const storageKey = 'mahjong-score-v2';
    let selectedFan = 3;
    let state = loadState();

    function scoreForFan(fan){ return 16 * Math.pow(2, fan - 3); }

    function normalizeName(name){ return String(name || '').trim(); }

    function uniqueNames(list){
      const seen = new Set();
      return list.map(normalizeName).filter(name => name && !seen.has(name) && seen.add(name));
    }

    function loadState(){
      const fallback = {
        players: [...defaultPlayers],
        seats: [...defaultPlayers],
        scores: Object.fromEntries(defaultPlayers.map(name => [name, 0])),
        history: []
      };
      try{
        const raw = localStorage.getItem(storageKey);
        if(raw){
          const parsed = JSON.parse(raw);
          const players = uniqueNames(Array.isArray(parsed.players) ? parsed.players : fallback.players);
          const seats = Array.isArray(parsed.seats) && parsed.seats.length === 4 ? parsed.seats.map(normalizeName) : fallback.seats;
          const scores = typeof parsed.scores === 'object' && parsed.scores ? parsed.scores : {};
          const history = Array.isArray(parsed.history) ? parsed.history : [];
          players.forEach(name => { if(typeof scores[name] !== 'number') scores[name] = 0; });
          seats.forEach(name => { if(name && !players.includes(name)) players.push(name); if(name && typeof scores[name] !== 'number') scores[name] = 0; });
          return { players, seats, scores, history };
        }

        const oldRaw = localStorage.getItem('mahjong-score-v1');
        if(oldRaw){
          const oldParsed = JSON.parse(oldRaw);
          const players = uniqueNames(Array.isArray(oldParsed.names) ? oldParsed.names : fallback.players);
          const totals = Array.isArray(oldParsed.totals) ? oldParsed.totals : [0,0,0,0];
          const scores = {};
          players.forEach((name, idx) => { scores[name] = Number(totals[idx] || 0); });
          return { players, seats:[...players.slice(0,4)], scores, history:[] };
        }
      }catch{}
      return fallback;
    }

    function saveState(){ localStorage.setItem(storageKey, JSON.stringify(state)); }

    function ensureStateIntegrity(){
      state.players = uniqueNames(state.players);
      defaultPlayers.forEach(name => {
        if(!state.players.includes(name)) state.players.push(name);
      });
      if(!Array.isArray(state.seats) || state.seats.length !== 4){
        state.seats = state.players.slice(0,4);
      }
      state.seats = state.seats.map((name, idx) => normalizeName(name) || state.players[idx] || state.players[0]);
      if(!state.scores || typeof state.scores !== 'object') state.scores = {};
      state.players.forEach(name => { if(typeof state.scores[name] !== 'number') state.scores[name] = 0; });
      if(!Array.isArray(state.history)) state.history = [];
    }

    function addPlayer(name){
      const clean = normalizeName(name);
      if(!clean) return { ok:false, message:'請先輸入人名。' };
      if(state.players.includes(clean)) return { ok:false, message:'呢個人名已經喺名單入面。' };
      state.players.push(clean);
      state.scores[clean] = 0;
      saveState();
      renderAll();
      return { ok:true };
    }

    function removePlayer(name){
      if(defaultPlayers.includes(name)) return;
      const usingSeat = state.seats.includes(name);
      const score = Number(state.scores[name] || 0);
      if(usingSeat || score !== 0){
        alert('呢個玩家仲喺座位上，或者仲有累積分數，暫時唔刪得。');
        return;
      }
      state.players = state.players.filter(player => player !== name);
      delete state.scores[name];
      saveState();
      renderAll();
    }

    function renderFanButtons(){
      const fanGrid = document.getElementById('fanGrid');
      fanGrid.innerHTML = fanValues.map(fan => {
        const score = scoreForFan(fan);
        return `<button class="fan-btn ${fan===selectedFan?'active':''}" data-fan="${fan}"><strong>${fan}番</strong><span>${score} 分</span></button>`;
      }).join('');
      fanGrid.querySelectorAll('.fan-btn').forEach(btn => btn.addEventListener('click', () => { selectedFan = Number(btn.dataset.fan); renderScore(); renderFanButtons(); }));
    }

    function renderScore(){
      const winType = document.getElementById('winType')?.value || 'discard';
      const score = scoreForFan(selectedFan);
      document.getElementById('scoreLabel').textContent = winType === 'selfdraw' ? '自摸（每家）' : '出銃分數';
      document.getElementById('scoreValue').textContent = score;
      document.getElementById('scoreFanText').textContent = `${selectedFan} 番`;
      document.getElementById('scoreDesc').textContent = winType === 'selfdraw' ? `每家 ${score} · 合共 ${score * 3}` : (selectedFan === 3 ? '一炮16' : `比 ${selectedFan-1} 番再高一級`);
    }

    function renderTable(){
      const max = scoreForFan(10);
      document.getElementById('scoreTable').innerHTML = fanValues.map(fan => {
        const score = scoreForFan(fan);
        const width = Math.max(8, Math.round(score / max * 100));
        return `<div class="row"><div><div class="fan">${fan}番</div><div class="mini">出銃</div></div><div class="bar"><i style="width:${width}%"></i></div><div class="pts">${score}</div></div>`;
      }).join('');
    }

    function renderPlayerChips(){
      const el = document.getElementById('playerChips');
      el.innerHTML = state.players.map(name => {
        const removable = !defaultPlayers.includes(name) && state.scores[name] === 0 && !state.seats.includes(name);
        return `<div class="chip">${name}${removable ? `<button data-remove="${name}">×</button>` : ''}</div>`;
      }).join('');
      el.querySelectorAll('[data-remove]').forEach(btn => btn.addEventListener('click', () => removePlayer(btn.dataset.remove)));
    }

    function renderSeats(){
      for(let i=0;i<4;i++){
        const seat = document.getElementById(`seat${i}`);
        const current = state.seats[i] || state.players[i] || state.players[0];
        seat.innerHTML = state.players.map(name => `<option value="${name}">${name}</option>`).join('');
        if(state.players.includes(current)) seat.value = current;
        else seat.value = state.players[0];
      }
    }

    function bindSeatEvents(){
      for(let i=0;i<4;i++){
        document.getElementById(`seat${i}`).addEventListener('change', (e) => {
          state.seats[i] = e.target.value;
          saveState();
          renderRoundSelectors();
        });
      }
    }

    function renderRoundSelectors(){
      const winType = document.getElementById('winType').value;
      const winner = document.getElementById('winner');
      const loser = document.getElementById('loser');
      const loserLabel = document.getElementById('loserLabel');
      const options = state.seats.map((name, idx) => `<option value="${idx}">${name}</option>`).join('');
      const currentWinner = winner.value || '0';
      const currentLoser = loser.value || '1';
      winner.innerHTML = options;
      loser.innerHTML = options;
      winner.value = currentWinner;
      loser.value = currentLoser === currentWinner ? String((Number(currentWinner)+1)%4) : currentLoser;
      loser.disabled = winType === 'selfdraw';
      loserLabel.textContent = winType === 'selfdraw' ? '出銃（自摸時唔使揀）' : '邊個出銃';
      renderScore();
    }

    function renderTotals(){
      const totals = Object.entries(state.scores).sort((a,b) => b[1]-a[1] || a[0].localeCompare(b[0], 'zh-HK'));
      document.getElementById('totals').innerHTML = totals.map(([name, score]) => {
        const cls = score > 0 ? 'plus' : score < 0 ? 'minus' : '';
        const prefix = score > 0 ? '+' : '';
        return `<div class="player-total"><div class="player-name">${name}</div><div class="player-score ${cls}">${prefix}${score}</div></div>`;
      }).join('');
    }

    function renderHistory(){
      const historyEl = document.getElementById('history');
      if(!state.history.length){
        historyEl.innerHTML = '<div class="empty">未有紀錄，揀好番數之後按「記錄呢鋪」。</div>';
        return;
      }
      historyEl.innerHTML = state.history.slice().reverse().map(item => `<div class="history-item"><strong>${item.label}</strong><div>${item.detail}</div></div>`).join('');
    }

    function applyRound(){
      const winType = document.getElementById('winType').value;
      const winnerIdx = Number(document.getElementById('winner').value);
      const loserIdx = Number(document.getElementById('loser').value);
      const winnerName = state.seats[winnerIdx];
      const loserName = state.seats[loserIdx];
      if(winType === 'discard' && winnerIdx === loserIdx){ alert('糊牌同出銃唔可以係同一個人。'); return; }
      const score = scoreForFan(selectedFan);
      const deltas = {};
      let label = '';
      let detail = '';

      if(winType === 'selfdraw'){
        state.seats.forEach((name, idx) => { deltas[name] = (deltas[name] || 0) + (idx === winnerIdx ? score * 3 : -score); });
        label = `${winnerName} 自摸`;
        detail = `${selectedFan}番 · 每家 ${score} 分 · 合共 ${score * 3}`;
      } else {
        deltas[winnerName] = (deltas[winnerName] || 0) + score;
        deltas[loserName] = (deltas[loserName] || 0) - score;
        label = `${winnerName} 食 ${loserName}`;
        detail = `${selectedFan}番 · ${score} 分`;
      }

      Object.entries(deltas).forEach(([name, delta]) => { state.scores[name] = Number(state.scores[name] || 0) + delta; });
      state.history.push({ label, detail, deltas, seats:[...state.seats] });
      saveState();
      renderTotals();
      renderHistory();
      renderPlayerChips();
    }

    function undoRound(){
      const last = state.history.pop();
      if(!last) return;
      if(last.deltas && typeof last.deltas === 'object'){
        Object.entries(last.deltas).forEach(([name, delta]) => { state.scores[name] = Number(state.scores[name] || 0) - delta; });
      }
      saveState();
      renderTotals();
      renderHistory();
      renderPlayerChips();
    }

    function resetBoard(){
      if(!confirm('清零所有玩家累積分數同紀錄？')) return;
      Object.keys(state.scores).forEach(name => { state.scores[name] = 0; });
      state.history = [];
      saveState();
      renderTotals();
      renderHistory();
      renderPlayerChips();
    }

    function renderAll(){
      ensureStateIntegrity();
      renderFanButtons();
      renderTable();
      renderPlayerChips();
      renderSeats();
      renderRoundSelectors();
      renderTotals();
      renderHistory();
      saveState();
    }

    ensureStateIntegrity();
    bindSeatEvents();
    document.getElementById('winType').addEventListener('change', renderRoundSelectors);
    document.getElementById('applyBtn').addEventListener('click', applyRound);
    document.getElementById('undoBtn').addEventListener('click', undoRound);
    document.getElementById('resetBtn').addEventListener('click', resetBoard);
    document.getElementById('addPlayerBtn').addEventListener('click', () => {
      const input = document.getElementById('newPlayerInput');
      const result = addPlayer(input.value);
      if(!result.ok){ alert(result.message); return; }
      input.value = '';
    });
    document.getElementById('newPlayerInput').addEventListener('keydown', (e) => {
      if(e.key === 'Enter'){
        e.preventDefault();
        document.getElementById('addPlayerBtn').click();
      }
    });
    renderAll();
  </script>
</body>
</html>
